<svg width="100%" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

```
<linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#0284C7"/>
  <stop offset="50%" stop-color="#06B6D4"/>
  <stop offset="100%" stop-color="#0284C7"/>
</linearGradient>

<filter id="shadow">
  <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
</filter>
```

  </defs>

  <!-- Background -->

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- Decorative floating dots -->

  <circle cx="100" cy="70" r="5" fill="#0284C7" opacity="0.35">
    <animate attributeName="cy" values="70;55;70" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="80" r="7" fill="#06B6D4" opacity="0.35">
    <animate attributeName="cy" values="80;100;80" dur="4s" repeatCount="indefinite"/>
